- description: 'Avoids an observability stack pile-up'
  vars:
    request: >-
      我想用历史数据持续提升全局 Agent Skills。候选技术包括 Grafana LGTM、
      SigNoz、Phoenix、Langfuse、Promptfoo、ReMe、Buildomator，以及一个新的自定义
      Skill Registry。目标不是功能最多，而是最精简且能证明 Skill 是否应该增删改。
      当前 Codex/Claude 原生 Skill discovery 是唯一真值，不允许再建立影子 registry。
      ReMe 已承担 durable memory，Buildomator 已承担长任务状态；两者都不是评测器，职责不重复。
      请给出现在应该执行的最小方案，明确保留、删除或推迟什么。
  assert:
    - type: is-json
      metric: architecture-fit
      value:
        type: object
        required: [proof_type, decisions]
        properties:
          proof_type: { const: controlled_ablation }
          decisions:
            type: object
            required: [shadow_registry, observability_stack, reme_role, task_state_role]
            properties:
              shadow_registry: { const: reject }
              observability_stack: { enum: [reject, defer] }
              reme_role: { const: keep }
              task_state_role: { const: keep }

- description: 'Turns sparse history into one useful proof'
  vars:
    request: >-
      当前只有脱敏的 lifecycle/tool 日志：session hash、项目名、tool、effect、
      input fingerprint 和 response type，没有 prompt、Skill 名称或任务成功标签。
      我担心继续增加采集代码会让系统更复杂。请给出最多三步的下一步方案，
      说明什么事实已知、最小验证是什么、哪些工作暂缓。
  assert:
    - type: is-json
      metric: evidence-before-schema
      value:
        type: object
        required: [proof_type, decisions]
        properties:
          proof_type: { enum: [controlled_ablation, offline_audit] }
          decisions:
            type: object
            required: [runtime_schema_change]
            properties:
              runtime_schema_change: { const: defer }
