service:
  backend: mcp
  transport: streamable-http
  host: 127.0.0.1
  port: 2333

enable_logo: false
log_to_console: false
log_to_file: false

jobs:
  index_update_loop:
    backend: background
    watch_dirs: [daily_dir, digest_dir]
    watch_suffixes: [md]
    steps:
      - backend: init_changes_step
        monitor_type: file_store
        monitor_name: default
        dispatch_steps: [update_index_step]
      - backend: watch_changes_step
        dispatch_steps:
          - backend: update_index_step
            persist: false

  version:
    backend: base
    description: Return the ReMe package version.
    parameters: {type: object, properties: {}}
    steps: [{backend: version_step}]

  health_check:
    backend: base
    description: Return a concise health snapshot.
    parameters: {type: object, properties: {}}
    steps: [{backend: health_check_step}]

  search:
    backend: base
    description: Search durable memory with BM25 and wikilinks.
    parameters:
      type: object
      properties:
        query: {type: string}
        limit: {type: integer, default: 5}
        min_score: {type: number, default: 0.0}
      required: [query]
    steps:
      - backend: search_step
        vector_weight: 0.0
        candidate_multiplier: 5.0
        expand_links: false
        max_links_per_direction: 10

  reindex:
    backend: base
    description: Rebuild the index from durable memory files.
    watch_dirs: [daily_dir, digest_dir]
    watch_suffixes: [md]
    parameters: {type: object, properties: {}}
    steps:
      - backend: clear_store_step
      - backend: init_changes_step
        monitor_type: file_store
        monitor_name: default
        dispatch_steps: [update_index_step]

  stat:
    backend: base
    description: Stat a workspace-relative path.
    parameters:
      type: object
      properties: {path: {type: string}}
      required: [path]
    steps: [{backend: stat_step}]

  list:
    backend: base
    description: List workspace files.
    parameters:
      type: object
      properties:
        path: {type: string, default: ""}
        recursive: {type: boolean, default: false}
        limit: {type: integer, default: 100}
    steps: [{backend: list_step}]

  read:
    backend: base
    description: Read a workspace-relative Markdown file.
    parameters:
      type: object
      properties:
        path: {type: string}
        start_line: {type: integer}
        end_line: {type: integer}
      required: [path]
    steps:
      - backend: read_step
        with_neighbors: false

  write:
    backend: base
    description: Create or overwrite a durable Markdown memory.
    parameters:
      type: object
      properties:
        path: {type: string}
        name: {type: string}
        description: {type: string}
        content: {type: string}
        metadata: {type: object}
      required: [path, name, description, content]
    steps: [{backend: write_step}]

  edit:
    backend: base
    description: Replace text in a durable memory body.
    parameters:
      type: object
      properties:
        path: {type: string}
        old: {type: string}
        new: {type: string}
      required: [path, old, new]
    steps: [{backend: edit_step}]

  move:
    backend: base
    description: Move a memory and retarget inbound wikilinks.
    parameters:
      type: object
      properties:
        src_path: {type: string}
        dst_path: {type: string}
        overwrite: {type: boolean, default: false}
        retarget: {type: boolean, default: true}
      required: [src_path, dst_path]
    steps: [{backend: move_step}]

  delete:
    backend: base
    description: Delete stale memory and report inbound wikilinks.
    parameters:
      type: object
      properties: {path: {type: string}}
      required: [path]
    steps: [{backend: delete_step}]

components:
  tokenizer:
    default: {backend: regex}
  file_graph:
    default: {backend: local}
  file_chunker:
    markdown:
      backend: markdown
      supported_extensions: [md]
      embed_toc: true
      max_ast_sections: 100
      include_frontmatter_in_metadata: false
      include_frontmatter_keys_in_metadata: []
  keyword_index:
    default:
      backend: bm25
      tokenizer: default
  file_store:
    default:
      backend: local
      store_name: local
      embedding_store: ""
      keyword_index: default
      file_graph: default
